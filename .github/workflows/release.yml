name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      RUST_MIN_STACK: '268435456'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc

      - name: Check version
        run: |
          test "$TAG" = "v$(jq -r .version nsh.json)"
          test "${TAG#v}" = "$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "countdowner") | .version')"
          test -s ".github/release-notes/$TAG.md"

      - name: Test the shared app
        run: cargo test --locked --lib

      - name: Build Windows binaries
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --locked --release --features native --target x86_64-pc-windows-msvc
          cargo build --locked --release --features native --target aarch64-pc-windows-msvc

      - name: Package portable downloads
        run: |
          cargo install cargo-bundle-licenses --locked --version 5.0.0
          mkdir -p build/release build/portable/licenses
          cargo bundle-licenses --features native --format yaml --output build/portable/licenses/THIRDPARTY.yml
          cp resources/fonts/OFL.txt build/portable/licenses/Countdowner-UI-OFL.txt
          for platform in x64 arm64; do
            target=x86_64-pc-windows-msvc
            if [[ "$platform" == arm64 ]]; then
              target=aarch64-pc-windows-msvc
            fi
            cp "target/$target/release/countdowner.exe" build/portable/Countdowner.exe
            (cd build/portable && 7z a -tzip "../release/Countdowner-windows-$platform.zip" Countdowner.exe licenses)
          done
          cd build/release
          sha256sum ./*.zip > SHA256SUMS.txt

      - name: Upload draft and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" build/release/* --draft --verify-tag \
            --title "Countdowner $TAG" \
            --notes-file ".github/release-notes/$TAG.md"
          gh release edit "$TAG" --draft=false --latest
          test "$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .immutable)" = true
