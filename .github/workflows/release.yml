name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check version
        run: test "$TAG" = "v$(jq -r .version mygo.json)"

      - name: Install headless test libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1 libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 libcairo2

      - name: Test and vet
        run: |
          go test ./... -count=1
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=arm64 go vet ./...

      - name: Build Windows binaries
        run: go tool mygo build -platform windows/amd64,windows/arm64

      - name: Package portable downloads
        run: |
          mkdir -p build/release
          for target in amd64 arm64; do
            architecture="$target"
            if [[ "$target" == "amd64" ]]; then
              architecture=x64
            fi
            (
              cd "build/windows-$target"
              zip -r "../release/Countdowner-windows-$architecture.zip" Countdowner.exe licenses
            )
          done
          cd build/release
          sha256sum ./*.zip > SHA256SUMS.txt

      - name: Upload draft and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" build/release/* --draft --verify-tag \
            --title "Countdowner $TAG" \
            --notes "Download the Windows x64 or ARM64 ZIP, extract it, and run Countdowner.exe. Keep the included licenses directory. Portable and unsigned."
          gh release edit "$TAG" --draft=false --latest
          test "$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .immutable)" = true
