name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check version
        run: |
          test "$TAG" = "v$(jq -r .version mygo.json)"
          test -s ".github/release-notes/$TAG.md"

      - name: Install headless test libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1 libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 libcairo2

      - name: Test and vet
        run: |
          go tool mygo i18n check
          go test ./... -count=1
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=arm64 go vet ./...

      - name: Build Windows binaries
        run: go tool mygo build -platform windows/amd64,windows/arm64

      - name: Package portable downloads
        run: |
          mkdir -p build/release
          for target in amd64 arm64; do
            architecture="$target"
            if [[ "$target" == "amd64" ]]; then
              architecture=x64
            fi
            (
              cd "build/windows-$target"
              zip -r "../release/Countdowner-windows-$architecture.zip" Countdowner.exe licenses
            )
          done
          cd build/release
          sha256sum ./*.zip > SHA256SUMS.txt

      - name: Upload draft and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" build/release/* --draft --verify-tag \
            --title "Countdowner $TAG" \
            --notes-file ".github/release-notes/$TAG.md"
          gh release edit "$TAG" --draft=false --latest
          test "$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .immutable)" = true
