[package]
name = "countdowner"
version = "0.1.15"
edition = "2024"
rust-version = "1.97"
publish = false

[features]
native = ["dep:nsh-platform-linux", "dep:nsh-platform-macos", "dep:nsh-platform-windows"]

[[bin]]
name = "countdowner"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6"
log = "0.4"
nsh-base = { version = "=0.7.2", default-features = false }
nsh-core = "=0.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "=0.7.2", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "=0.7.2", default-features = false, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "=0.7.2", default-features = false, optional = true }

[dev-dependencies]
nsh-engine = { version = "=0.7.2", default-features = false }
nsh-testing = { version = "=0.7.2", default-features = false }
